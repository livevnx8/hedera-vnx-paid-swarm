<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="800" height="400" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="0.5">VNX Worker Swarm — Score Leaderboard</text>
  <line x1="200" y1="58" x2="600" y2="58" stroke="#334155" stroke-width="1"/>

  <!-- Headers -->
  <text x="50" y="90" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">RANK</text>
  <text x="130" y="90" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">WORKER</text>
  <text x="360" y="90" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">SPECIALTY</text>
  <text x="490" y="90" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">PRICE</text>
  <text x="590" y="90" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">SCORE</text>
  <text x="690" y="90" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">CONFIDENCE</text>

  <!-- Row 1: ONNX -->
  <rect x="40" y="105" width="720" height="50" rx="8" fill="#0F172A" stroke="url(#b1)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="65" y="135" fill="#22D3EE" font-family="sans-serif" font-size="16" font-weight="700">1</text>
  <text x="130" y="135" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600">BitLattice-ONNX</text>
  <text x="360" y="135" fill="#94A3B8" font-family="sans-serif" font-size="12">prediction</text>
  <text x="490" y="135" fill="#94A3B8" font-family="sans-serif" font-size="12">0.005 HBAR</text>
  <text x="590" y="135" fill="#22D3EE" font-family="sans-serif" font-size="14" font-weight="700">176.47</text>
  <rect x="680" y="118" width="60" height="24" rx="4" fill="#22D3EE" opacity="0.15"/>
  <text x="710" y="135" text-anchor="middle" fill="#22D3EE" font-family="sans-serif" font-size="12" font-weight="700">0.90</text>
  <text x="60" y="155" fill="#22D3EE" font-family="sans-serif" font-size="10">Winner</text>

  <!-- Row 2: SMA -->
  <rect x="40" y="170" width="720" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="65" y="200" fill="#FBBF24" font-family="sans-serif" font-size="16" font-weight="700">2</text>
  <text x="130" y="200" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600">SMA-Trend</text>
  <text x="360" y="200" fill="#94A3B8" font-family="sans-serif" font-size="12">trend</text>
  <text x="490" y="200" fill="#94A3B8" font-family="sans-serif" font-size="12">0.002 HBAR</text>
  <text x="590" y="200" fill="#FBBF24" font-family="sans-serif" font-size="14" font-weight="700">166.67</text>
  <rect x="680" y="183" width="60" height="24" rx="4" fill="#FBBF24" opacity="0.15"/>
  <text x="710" y="200" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-size="12" font-weight="700">0.50</text>

  <!-- Row 3: RSI -->
  <rect x="40" y="235" width="720" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="65" y="265" fill="#34D399" font-family="sans-serif" font-size="16" font-weight="700">3</text>
  <text x="130" y="265" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600">RSI-Momentum</text>
  <text x="360" y="265" fill="#94A3B8" font-family="sans-serif" font-size="12">momentum</text>
  <text x="490" y="265" fill="#94A3B8" font-family="sans-serif" font-size="12">0.003 HBAR</text>
  <text x="590" y="265" fill="#34D399" font-family="sans-serif" font-size="14" font-weight="700">123.33</text>
  <rect x="680" y="248" width="60" height="24" rx="4" fill="#34D399" opacity="0.15"/>
  <text x="710" y="265" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="12" font-weight="700">0.50</text>

  <!-- Row 4: BB -->
  <rect x="40" y="300" width="720" height="50" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="65" y="330" fill="#A78BFA" font-family="sans-serif" font-size="16" font-weight="700">4</text>
  <text x="130" y="330" fill="#F1F5F9" font-family="sans-serif" font-size="13" font-weight="600">BB-Volatility</text>
  <text x="360" y="330" fill="#94A3B8" font-family="sans-serif" font-size="12">volatility</text>
  <text x="490" y="330" fill="#94A3B8" font-family="sans-serif" font-size="12">0.003 HBAR</text>
  <text x="590" y="330" fill="#A78BFA" font-family="sans-serif" font-size="14" font-weight="700">96.77</text>
  <rect x="680" y="313" width="60" height="24" rx="4" fill="#A78BFA" opacity="0.15"/>
  <text x="710" y="330" text-anchor="middle" fill="#A78BFA" font-family="sans-serif" font-size="12" font-weight="700">0.50</text>

  <!-- Formula footer -->
  <rect x="40" y="365" width="720" height="24" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="400" y="382" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="10">score = confidence × specialty_match / (price_hbar + 0.0001)  ·  cap = 0.01 HBAR</text>
</svg>
