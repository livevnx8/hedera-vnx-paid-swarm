<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#12182b"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2332"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4aa"/>
      <stop offset="1" stop-color="#00a8e8"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="450" y="28" text-anchor="middle" fill="#e0e6ed" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600">VNX Paid Micro-Swarm Architecture</text>

  <!-- Task Input -->
  <rect x="30" y="55" width="130" height="50" rx="6" fill="url(#boxGrad)" stroke="#3a4a5c" stroke-width="1" filter="url(#shadow)"/>
  <text x="95" y="75" text-anchor="middle" fill="#00d4aa" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">TASK INPUT</text>
  <text x="95" y="92" text-anchor="middle" fill="#8899aa" font-family="Segoe UI, sans-serif" font-size="9">Price signal query</text>

  <!-- Arrow to Workers -->
  <line x1="160" y1="80" x2="200" y2="80" stroke="#00d4aa" stroke-width="2"/>
  <polygon points="200,80 194,76 194,84" fill="#00d4aa"/>

  <!-- Workers -->
  <rect x="210" y="55" width="100" height="50" rx="6" fill="url(#boxGrad)" stroke="#00a8e8" stroke-width="1" filter="url(#shadow)"/>
  <text x="260" y="72" text-anchor="middle" fill="#00a8e8" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">BitLattice-ONNX</text>
  <text x="260" y="85" text-anchor="middle" fill="#8899aa" font-family="Segoe UI, sans-serif" font-size="8">prediction · 0.005 ℏ</text>
  <text x="260" y="96" text-anchor="middle" fill="#667788" font-family="Segoe UI, sans-serif" font-size="8">score = conf×match/price</text>

  <rect x="210" y="120" width="100" height="50" rx="6" fill="url(#boxGrad)" stroke="#5c7aea" stroke-width="1" filter="url(#shadow)"/>
  <text x="260" y="137" text-anchor="middle" fill="#5c7aea" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">RSI-Momentum</text>
  <text x="260" y="150" text-anchor="middle" fill="#8899aa" font-family="Segoe UI, sans-serif" font-size="8">momentum · 0.003 ℏ</text>
  <text x="260" y="161" text-anchor="middle" fill="#667788" font-family="Segoe UI, sans-serif" font-size="8">score = conf×match/price</text>

  <rect x="210" y="185" width="100" height="50" rx="6" fill="url(#boxGrad)" stroke="#c084fc" stroke-width="1" filter="url(#shadow)"/>
  <text x="260" y="202" text-anchor="middle" fill="#c084fc" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">BB-Volatility</text>
  <text x="260" y="215" text-anchor="middle" fill="#8899aa" font-family="Segoe UI, sans-serif" font-size="8">volatility · 0.003 ℏ</text>
  <text x="260" y="226" text-anchor="middle" fill="#667788" font-family="Segoe UI, sans-serif" font-size="8">score = conf×match/price</text>

  <rect x="210" y="250" width="100" height="50" rx="6" fill="url(#boxGrad)" stroke="#f59e0b" stroke-width="1" filter="url(#shadow)"/>
  <text x="260" y="267" text-anchor="middle" fill="#f59e0b" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">SMA-Trend</text>
  <text x="260" y="280" text-anchor="middle" fill="#8899aa" font-family="Segoe UI, sans-serif" font-size="8">trend · 0.002 ℏ</text>
  <text x="260" y="291" text-anchor="middle" fill="#667788" font-family="Segoe UI, sans-serif" font-size="8">score = conf×match/price</text>

  <!-- Arrows to Coordinator -->
  <line x1="310" y1="80" x2="370" y2="145" stroke="#3a4a5c" stroke-width="1.5"/>
  <polygon points="370,145 364,138 362,146" fill="#3a4a5c"/>
  <line x1="310" y1="145" x2="370" y2="155" stroke="#3a4a5c" stroke-width="1.5"/>
  <polygon points="370,155 363,149 363,157" fill="#3a4a5c"/>
  <line x1="310" y1="210" x2="370" y2="165" stroke="#3a4a5c" stroke-width="1.5"/>
  <polygon points="370,165 363,159 363,167" fill="#3a4a5c"/>
  <line x1="310" y1="275" x2="370" y2="175" stroke="#3a4a5c" stroke-width="1.5"/>
  <polygon points="370,175 363,169 363,177" fill="#3a4a5c"/>

  <!-- Coordinator -->
  <rect x="370" y="125" width="120" height="70" rx="8" fill="url(#boxGrad)" stroke="url(#accent)" stroke-width="2" filter="url(#shadow)"/>
  <text x="430" y="150" text-anchor="middle" fill="#00d4aa" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">COORDINATOR</text>
  <text x="430" y="168" text-anchor="middle" fill="#8899aa" font-family="Segoe UI, sans-serif" font-size="9">Filter by cap · Select winner</text>
  <text x="430" y="182" text-anchor="middle" fill="#667788" font-family="Segoe UI, sans-serif" font-size="8">Trigger payment · Build receipt</text>

  <!-- Arrow to Payment Rail -->
  <line x1="490" y1="160" x2="540" y2="160" stroke="#00d4aa" stroke-width="2"/>
  <polygon points="540,160 534,156 534,164" fill="#00d4aa"/>

  <!-- Payment Rail -->
  <rect x="540" y="125" width="130" height="70" rx="8" fill="url(#boxGrad)" stroke="#00a8e8" stroke-width="2" filter="url(#shadow)"/>
  <text x="605" y="150" text-anchor="middle" fill="#00a8e8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">HederaPaymentRail</text>
  <text x="605" y="168" text-anchor="middle" fill="#8899aa" font-family="Segoe UI, sans-serif" font-size="9">Mainnet enforcement</text>
  <text x="605" y="182" text-anchor="middle" fill="#667788" font-family="Segoe UI, sans-serif" font-size="8">Amount validation · Lazy init</text>

  <!-- Arrow to Mainnet -->
  <line x1="670" y1="145" x2="730" y2="110" stroke="#00d4aa" stroke-width="2"/>
  <polygon points="730,110 723,108 726,115" fill="#00d4aa"/>

  <!-- Hedera Mainnet -->
  <rect x="730" y="75" width="130" height="50" rx="8" fill="#0d1f15" stroke="#00d4aa" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="98" text-anchor="middle" fill="#00d4aa" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">Hedera Mainnet</text>
  <text x="795" y="113" text-anchor="middle" fill="#8899aa" font-family="Segoe UI, sans-serif" font-size="9">HBAR transfer · Consensus</text>

  <!-- Arrow to Receipt -->
  <line x1="670" y1="175" x2="730" y2="210" stroke="#c084fc" stroke-width="2"/>
  <polygon points="730,210 723,208 726,215" fill="#c084fc"/>

  <!-- Proof Receipt -->
  <rect x="730" y="195" width="130" height="70" rx="8" fill="#1a1025" stroke="#c084fc" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="220" text-anchor="middle" fill="#c084fc" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">ProofReceiptBuilder</text>
  <text x="795" y="238" text-anchor="middle" fill="#8899aa" font-family="Segoe UI, sans-serif" font-size="9">SHA-256 hashes · Task + Decision</text>
  <text x="795" y="252" text-anchor="middle" fill="#667788" font-family="Segoe UI, sans-serif" font-size="8">HashScan URL · Mirror Node URL</text>

  <!-- Verifier Box -->
  <rect x="540" y="235" width="130" height="50" rx="6" fill="#1a1025" stroke="#5c7aea" stroke-width="1" filter="url(#shadow)"/>
  <text x="605" y="255" text-anchor="middle" fill="#5c7aea" font-family="Segoe UI, sans-serif" font-size="10" font-weight="600">Proof Verifier</text>
  <text x="605" y="270" text-anchor="middle" fill="#8899aa" font-family="Segoe UI, sans-serif" font-size="8">Recompute hashes · Mirror check</text>

  <!-- Arrow from Receipt to Verifier -->
  <line x1="730" y1="240" x2="670" y2="255" stroke="#5c7aea" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="670,255 677,252 677,260" fill="#5c7aea"/>

  <!-- Legend -->
  <text x="30" y="315" fill="#556677" font-family="Segoe UI, sans-serif" font-size="8">Scoring: score = confidence × specialty_match / (price_hbar + 0.0001)  ·  Default cap: 0.01 ℏ  ·  Network: mainnet only</text>
</svg>
