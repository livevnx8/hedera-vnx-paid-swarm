      <text x="30" y="38" text-anchor="middle" fill="#fef3c7" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800">4</text>
      <text x="30" y="92" text-anchor="middle" fill="#cbd5e1" font-family="Inter, Segoe UI, sans-serif" font-size="14">tests</text>
