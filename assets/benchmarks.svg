<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E293B" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1000" height="520" rx="14" fill="url(#bg)"/>

  <text x="500" y="42" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">VNX Paid Swarm Local Benchmarks</text>
  <text x="500" y="66" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Node v20.20.2 · 1,000 iterations · local deterministic package operations only</text>
  <line x1="220" y1="84" x2="780" y2="84" stroke="url(#accent)" stroke-width="1.5" opacity="0.55"/>

  <!-- Stat cards -->
  <rect x="55" y="112" width="270" height="104" rx="10" fill="url(#card)" stroke="url(#cyan)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="142" fill="#22D3EE" font-family="sans-serif" font-size="13" font-weight="700">Worker Selection</text>
  <text x="80" y="176" fill="#F8FAFC" font-family="sans-serif" font-size="26" font-weight="800">0.0112 ms</text>
  <text x="80" y="199" fill="#94A3B8" font-family="sans-serif" font-size="12">88,975.28 ops/sec · plan-only path</text>

  <rect x="365" y="112" width="270" height="104" rx="10" fill="url(#card)" stroke="url(#green)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="390" y="142" fill="#34D399" font-family="sans-serif" font-size="13" font-weight="700">Receipt Build</text>
  <text x="390" y="176" fill="#F8FAFC" font-family="sans-serif" font-size="26" font-weight="800">0.0024 ms</text>
  <text x="390" y="199" fill="#94A3B8" font-family="sans-serif" font-size="12">416,466.94 ops/sec · SHA-256 receipt</text>

  <rect x="675" y="112" width="270" height="104" rx="10" fill="url(#card)" stroke="url(#violet)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="700" y="142" fill="#A78BFA" font-family="sans-serif" font-size="13" font-weight="700">Hiero Verify Agent</text>
  <text x="700" y="176" fill="#F8FAFC" font-family="sans-serif" font-size="26" font-weight="800">0.0034 ms</text>
  <text x="700" y="199" fill="#94A3B8" font-family="sans-serif" font-size="12">295,338.70 ops/sec · local proof checks</text>

  <!-- Bars -->
  <text x="70" y="266" fill="#CBD5E1" font-family="sans-serif" font-size="14" font-weight="700">Ops/sec comparison</text>
  <text x="835" y="266" text-anchor="end" fill="#64748B" font-family="sans-serif" font-size="11">Scale max: 416,466.94</text>

  <text x="70" y="310" fill="#94A3B8" font-family="sans-serif" font-size="12">worker_selection_plan_only</text>
  <rect x="270" y="294" width="650" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="270" y="294" width="139" height="24" rx="5" fill="url(#cyan)"/>
  <text x="430" y="311" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="700">88,975.28 ops/sec</text>

  <text x="70" y="354" fill="#94A3B8" font-family="sans-serif" font-size="12">receipt_build_sha256</text>
  <rect x="270" y="338" width="650" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="270" y="338" width="650" height="24" rx="5" fill="url(#green)"/>
  <text x="845" y="355" text-anchor="end" fill="#022C22" font-family="sans-serif" font-size="12" font-weight="800">416,466.94 ops/sec</text>

  <text x="70" y="398" fill="#94A3B8" font-family="sans-serif" font-size="12">hiero_verify_agent_local</text>
  <rect x="270" y="382" width="650" height="24" rx="5" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <rect x="270" y="382" width="461" height="24" rx="5" fill="url(#violet)"/>
  <text x="750" y="399" fill="#EDE9FE" font-family="sans-serif" font-size="12" font-weight="700">295,338.70 ops/sec</text>

  <!-- Footer -->
  <rect x="55" y="445" width="890" height="48" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="80" y="466" fill="#FBBF24" font-family="sans-serif" font-size="12" font-weight="700">Scope</text>
  <text x="132" y="466" fill="#CBD5E1" font-family="sans-serif" font-size="12">Local benchmarks exclude live Hedera network settlement and public mirror-node latency.</text>
  <text x="80" y="484" fill="#64748B" font-family="sans-serif" font-size="11">Command: npm run benchmark · Cases are covered by Jest benchmark invariants.</text>
</svg>
