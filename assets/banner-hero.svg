<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-purple">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)" rx="0"/>

  <!-- Ambient glow orbs -->
  <circle cx="200" cy="200" r="280" fill="url(#glow1)" filter="url(#glow-cyan)"/>
  <circle cx="1100" cy="500" r="320" fill="url(#glow2)" filter="url(#glow-purple)"/>

  <!-- Grid lines -->
  <g stroke="#1E293B" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Main title -->
  <text x="640" y="260" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="1">VNX Paid Micro-Swarm</text>
  <line x1="440" y1="285" x2="840" y2="285" stroke="url(#accent)" stroke-width="3" opacity="0.8"/>

  <!-- Subtitle -->
  <text x="640" y="340" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="22" font-weight="400" letter-spacing="0.3">Deterministic Agent Swarm · Hedera Mainnet · Cryptographic Proof</text>

  <!-- Feature pills -->
  <rect x="340" y="400" width="160" height="44" rx="22" fill="#0F172A" stroke="url(#accent)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="420" y="428" text-anchor="middle" fill="#22D3EE" font-family="sans-serif" font-size="13" font-weight="700">4 VNX Workers</text>

  <rect x="520" y="400" width="200" height="44" rx="22" fill="#0F172A" stroke="url(#accent)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="620" y="428" text-anchor="middle" fill="#A78BFA" font-family="sans-serif" font-size="13" font-weight="700">HBAR Payment Rail</text>

  <rect x="740" y="400" width="200" height="44" rx="22" fill="#0F172A" stroke="url(#accent)" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="840" y="428" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="13" font-weight="700">SHA-256 Receipts</text>

  <!-- Bottom bar -->
  <rect x="0" y="600" width="1280" height="40" fill="#0B1120" opacity="0.8"/>
  <text x="640" y="625" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="12" letter-spacing="1">VERA LATTICE · HEDERA COMPETITION · TOPIC 0.0.10416185 · MAINNET ONLY</text>

  <!-- Decorative corner accents -->
  <path d="M40,40 L40,80 M40,40 L80,40" stroke="#22D3EE" stroke-width="2" opacity="0.6"/>
  <path d="M1240,40 L1200,40 M1240,40 L1240,80" stroke="#22D3EE" stroke-width="2" opacity="0.6"/>
  <path d="M40,600 L40,560 M40,600 L80,600" stroke="#A78BFA" stroke-width="2" opacity="0.6"/>
  <path d="M1240,600 L1200,600 M1240,600 L1240,560" stroke="#A78BFA" stroke-width="2" opacity="0.6"/>
</svg>
